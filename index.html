<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Word by Word 自然拼读单词卡</title>
<style>
:root{
  --bg:#f0f6ff; --card:#fff; --ink:#233; --sub:#6b7a90; --accent:#4f7cff; --accent2:#ff7b54;
  --good:#2ecc71; --bad:#e74c3c; --radius:16px; --fam:#ff9f43;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#4f7cff,#7c5cff);color:#fff;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
header h1{font-size:18px;display:flex;align-items:center;gap:8px}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.tabs{display:flex;gap:8px;margin-top:10px}
.tab{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;font-size:14px;cursor:pointer;border:none;font-weight:600}
.tab.active{background:#fff;color:var(--accent)}
#controls{position:sticky;top:64px;z-index:10;background:var(--bg);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#controls select,#controls button{font-size:14px;padding:7px 12px;border-radius:10px;border:1px solid #d5e0f0;background:#fff;color:var(--ink);cursor:pointer}
#controls .spacer{flex:1}
#wordCount{font-size:13px;color:var(--sub)}
main{padding:12px 16px 90px;max-width:960px;margin:0 auto}
/* ---- family sections ---- */
.famsec{background:var(--card);border-radius:var(--radius);padding:16px 14px;margin-bottom:16px;box-shadow:0 2px 10px rgba(30,60,120,.08)}
.famhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.famtitle{background:var(--fam);color:#fff;font-size:20px;font-weight:800;border-radius:12px;padding:6px 16px;letter-spacing:1px}
.famdesc{font-size:13px;color:var(--sub)}
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{background:#f8fbff;border-radius:12px;padding:10px;text-align:center;border:1px solid #e3ecfa;cursor:pointer;transition:transform .1s}
.fcard:active{transform:scale(.96)}
.fcard img{width:100%;height:110px;object-fit:contain;background:#fff;border-radius:8px}
.fcard .build{font-size:14px;font-weight:700;color:var(--accent);margin-top:6px}
.fcard .build .eq{color:var(--sub);font-weight:400;font-size:12px}
.fcard .word{font-size:18px;font-weight:800;color:#2b3a55;margin-top:1px}
.fcard .phon{font-size:12px;color:var(--sub)}
.fcard .cn{font-size:12.5px;color:#3d4c63;margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .play{display:inline-flex;align-items:center;gap:3px;margin-top:6px;font-size:11.5px;color:var(--accent);background:#eef4ff;padding:3px 8px;border-radius:20px;font-weight:600}
.fcard .noimg{height:110px;display:flex;align-items:center;justify-content:center;background:#f1f5fb;border-radius:8px;color:#b0bfd4;font-size:26px}
.plays{display:flex;gap:6px;justify-content:center;margin-top:6px}
.play{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--accent);background:#eef4ff;padding:3px 8px;border-radius:20px;font-weight:600;cursor:pointer}
.play.uk{background:#fff0e8;color:#d97b29}
.play.us{background:#eef4ff;color:var(--accent)}
.phon2{font-size:12px;color:var(--sub);margin-top:3px}
.phon2 .uk{color:#d97b29}
.phon2 .us{color:#4f7cff}
/* ---- word grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border-radius:var(--radius);padding:14px 12px;box-shadow:0 2px 8px rgba(30,60,120,.08);cursor:pointer;transition:transform .1s;border:2px solid transparent}
.card:active{transform:scale(.96)}
.card img{width:100%;height:105px;object-fit:contain;background:#f8fbff;border-radius:10px;margin-bottom:6px}
.card .noimg{height:105px;display:flex;align-items:center;justify-content:center;background:#f1f5fb;border-radius:10px;color:#b0bfd4;font-size:24px;margin-bottom:6px}
.card .phon{font-size:13px;color:var(--sub);margin-top:3px}
.card .cn{font-size:13.5px;color:#3d4c63;margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .play{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--accent);background:#eef4ff;padding:4px 9px;border-radius:20px;font-weight:600}
/* ---- quiz ---- */
.qbox{background:var(--card);border-radius:var(--radius);padding:22px 18px;box-shadow:0 2px 12px rgba(30,60,120,.08);text-align:center;max-width:520px;margin:8px auto}
.qtype{font-size:13px;color:var(--sub);margin-bottom:12px}
.qprompt{font-size:22px;font-weight:700;margin:14px 0;line-height:1.4;word-break:break-word}
.qprompt .bigword{font-size:30px}
.qimg{width:180px;height:150px;object-fit:contain;background:#f8fbff;border-radius:12px;margin:4px auto 8px;display:block}
.speakbtn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:64px;height:64px;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(79,124,255,.4);margin:6px auto 14px;display:flex;align-items:center;justify-content:center}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{border:2px solid #dde7f7;background:#fff;border-radius:12px;padding:14px 8px;font-size:17px;font-weight:600;cursor:pointer;transition:all .12s;color:#2b3a55}
.opt:active{transform:scale(.96)}
.opt.right{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.qmeta{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;color:var(--sub)}
.spellwrap{margin-top:14px}
.spellinput{width:100%;padding:14px;font-size:24px;text-align:center;border:2px solid #dde7f7;border-radius:12px;outline:none;font-weight:700;letter-spacing:2px;color:#2b3a55}
.spellinput:focus{border-color:var(--accent)}
.spellinput.right{border-color:var(--good);background:#f0fff4}
.spellinput.wrong{border-color:var(--bad);background:#fff5f5}
.spellcheckbtn{margin-top:12px;width:100%;padding:13px;border:none;border-radius:12px;font-size:17px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.spellfb{margin-top:12px;font-size:16px;font-weight:700;min-height:24px}
.spellfb.right{color:var(--good)}
.spellfb.wrong{color:var(--bad)}
.spellfb .ans{color:var(--sub);font-weight:600}
.speakrow{display:flex;gap:10px;justify-content:center;margin:6px auto 14px}
.speakbtn{background:var(--accent);color:#fff;border:none;border-radius:50%;width:64px;height:64px;font-size:28px;cursor:pointer;box-shadow:0 4px 14px rgba(79,124,255,.4);display:flex;align-items:center;justify-content:center}
.speakbtn.uk{background:#ff9f43;box-shadow:0 4px 14px rgba(255,159,67,.4);width:56px;height:56px;font-size:20px;border-radius:50%}
#result{display:none;text-align:center;padding:30px 16px}
#result h2{font-size:22px;margin-bottom:8px}
#result .score{font-size:40px;font-weight:800;color:var(--accent);margin:12px 0}
#result .mistakeList{margin:16px auto;max-width:460px;text-align:left}
.mistake-item{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:10px;padding:10px 14px;margin:6px 0;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer}
.mistake-item .w{font-weight:700}
.mistake-item .c{color:var(--sub);font-size:13px}
.btn{padding:12px 26px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:#e8effd;color:var(--accent)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(20,30,50,.9);color:#fff;padding:10px 22px;border-radius:30px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99}
#toast.show{opacity:1}
.searchwrap{position:relative;flex:1;min-width:120px}
#search{padding:8px 12px;border-radius:10px;border:1px solid #d5e0f0;font-size:14px;width:100%}
#famNav{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
#famNav::-webkit-scrollbar{display:none}
.famchip{flex:0 0 auto;background:#fff;border:1px solid #d5e0f0;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;cursor:pointer;color:#3d4c63}
.famchip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.qnav{display:flex;gap:8px;justify-content:center;margin-top:16px}
.qnavbtn{flex:1;max-width:150px;padding:11px 0;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;background:#eef4ff;color:var(--accent);transition:transform .1s}
.qnavbtn:active{transform:scale(.96)}
.qnavbtn.showans{background:#fff3e6;color:#d97b29}
.qnavbtn:disabled{opacity:.4}
.anscard{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff;border-radius:14px;padding:14px 12px;margin:10px auto 4px;max-width:420px;text-align:center;box-shadow:0 4px 14px rgba(46,204,113,.35)}
.anscard .alabel{font-size:13px;opacity:.9;font-weight:700;letter-spacing:2px}
.anscard .aword{font-size:30px;font-weight:800;margin:4px 0 2px;letter-spacing:1px}
.anscard .acn{font-size:15px;opacity:.95}
</style>
</head>
<body>
<header>
  <h1>📖 Word by Word 自然拼读单词卡</h1>
  <div class="sub">Word by Word Primary Phonics Picture Dictionary · 词族拼读 · 点卡片听发音 · v8</div>
  <div class="tabs">
    <button class="tab active" id="tabFam" onclick="switchTab('fam')">🧩 词族拼读</button>
    <button class="tab" id="tabLearn" onclick="switchTab('learn')">📚 全部单词</button>
    <button class="tab" id="tabQuiz" onclick="switchTab('quiz')">✏️ 记单词</button>
  </div>
</header>

<div id="controls" style="display:none">
  <div class="searchwrap"><input id="search" placeholder="🔍 搜索单词..." oninput="renderLearn()"></div>
  <select id="groupSel" onchange="renderLearn()"><option value="all">全部单词</option></select>
  <div class="spacer"></div>
  <span id="wordCount"></span>
</div>

<main>
  <div id="fam">
    <div id="famNav"></div>
    <div id="famList"></div>
  </div>

  <div id="learn" class="grid" style="display:none"></div>

  <div id="quiz" style="display:none">
    <div id="quizModes" style="display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none"></div>
    <div class="qbox">
      <div class="qtype" id="qTypeLabel"></div>
      <div id="ansCard" class="anscard" style="display:none"></div>
      <img class="qimg" id="qImg" alt="" style="display:none">
      <div id="qPrompt" class="qprompt"></div>
      <div class="speakrow">
        <button class="speakbtn" id="speakBtn" onclick="speakCurrent('us')">🔊</button>
        <button class="speakbtn uk" id="speakBtnUk" onclick="speakCurrent('uk')">🇬🇧</button>
      </div>
      <div class="options" id="options"></div>
      <div id="spellArea" style="display:none">
        <div class="spellwrap">
          <input id="spellInput" class="spellinput" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off" enterkeyhint="done" placeholder="✏️ 在这里输入单词" onkeydown="if(event.key==='Enter'){event.preventDefault();checkSpell();}">
          <button class="spellcheckbtn" onclick="checkSpell()">✅ 确认答案</button>
          <div class="spellfb" id="spellFb"></div>
        </div>
      </div>
      <div class="qnav">
        <button class="qnavbtn" onclick="navQ(-1)">⬅️ 上一题</button>
        <button class="qnavbtn showans" id="showAnsBtn" onclick="showAnswer()">👀 看答案</button>
        <button class="qnavbtn" onclick="navQ(1)">下一题 ➡️</button>
      </div>
      <div class="qmeta">
        <span id="qIdx"></span>
        <span id="qScore"></span>
      </div>
    </div>
  </div>

  <div id="result" style="display:none">
    <h2>🎉 完成!</h2>
    <div class="score" id="scoreNum"></div>
    <p id="scoreDetail" style="color:var(--sub)"></p>
    <div style="margin:18px 0">
      <button class="btn primary" onclick="restartQuiz()">🔁 再测一遍</button>
      <button class="btn ghost" onclick="retryMistakes()">❌ 只测错题</button>
    </div>
    <div class="mistakeList" id="mistakeList"></div>
  </div>
</main>
<div id="toast"></div>

<script src="words.js?v=8"></script>
<script src="families.js?v=8"></script>
<script>
const WORDS = WORDS_DATA;
const WORDS_BY_ID = {}; WORDS.forEach(w => WORDS_BY_ID[w.word] = w);

/* ======== audio ======== */
const audioCache = {};
function playWord(word, variant){
  const a = audioCache[word+variant] || (audioCache[word+variant] = new Audio(`audio/${word}_${variant}.mp3`));
  a.onerror = () => speakTTS(word);
  a.play().catch(() => speakTTS(word));
}
function speakTTS(word){
  const u = new SpeechSynthesisUtterance(word); u.lang='en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ======== family view ======== */
let curFam = 'all';
function renderFamNav(){
  const el = document.getElementById('famNav');
  el.innerHTML = `<button class="famchip ${curFam==='all'?'active':''}" onclick="setFam('all')">全部</button>` +
    FAMILIES.map(f => `<button class="famchip ${curFam===f.family?'active':''}" onclick="setFam('${f.family}')">-${f.family}-</button>`).join('');
}
function setFam(f){ curFam = f; renderFamNav(); renderFam(); }
function renderFam(){
  const list = curFam==='all' ? FAMILIES : FAMILIES.filter(f=>f.family===curFam);
  document.getElementById('famList').innerHTML = list.map(f => `
    <div class="famsec">
      <div class="famhead">
        <span class="famtitle">-${f.family}-</span>
        <span class="famdesc">${f.words.length} 个单词 · 点击卡片听发音</span>
      </div>
      <div class="famgrid">
        ${f.words.map(w => `
          <div class="fcard" onclick="playWord('${w.word}','us')">
            ${w.img ? `<img src="${w.img}" alt="${w.word}" loading="lazy">` : `<div class="noimg">🖼️</div>`}
            <div class="build">${w.build ? `${w.build.replace('+', ' + ')} <span class="eq">=</span> <span style="color:#2b3a55">${w.word}</span>` : w.word}</div>
            <div class="phon2">${w.uk ? `<span class="uk">英 /${w.uk}/</span>` : ''} ${w.us ? `<span class="us">美 /${w.us}/</span>` : ''}</div>
            <div class="cn">${w.cn.join('；')}</div>
            <div class="plays">
              <span class="play uk" onclick="event.stopPropagation();playWord('${w.word}','uk')">🇬🇧 英音</span>
              <span class="play us" onclick="event.stopPropagation();playWord('${w.word}','us')">🇺🇸 美音</span>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

/* ======== learn view ======== */
function groups(){
  const m = {}; WORDS.forEach(w => { (m[w.groups[0]] = m[w.groups[0]] || []).push(w); }); return m;
}
function initGroups(){
  const sel = document.getElementById('groupSel');
  const g = groups();
  sel.innerHTML = '<option value="all">全部单词</option>';
  Object.keys(g).sort().forEach(k => {
    const o = document.createElement('option'); o.value = k; o.textContent = `${k} (${g[k].length})`; sel.appendChild(o);
  });
}
function visibleWords(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const g = groups();
  let list = curGroup === 'all' ? WORDS : (g[curGroup] || []);
  if(q) list = list.filter(w => w.word.includes(q) || (w.cn||[]).join(' ').includes(q));
  return list;
}
let curGroup = 'all';
function renderLearn(){
  const list = visibleWords();
  document.getElementById('wordCount').textContent = `${list.length} 词`;
  document.getElementById('learn').innerHTML = list.map(w => `
    <div class="card" onclick="playWord('${w.word}','us')">
      ${w.img ? `<img src="${w.img}" alt="${w.word}" loading="lazy">` : `<div class="noimg">🖼️</div>`}
      <div class="word">${w.word}</div>
      <div class="phon2">${w.uk ? `<span class="uk">英 /${w.uk}/</span>` : ''} ${w.us ? `<span class="us">美 /${w.us}/</span>` : ''}</div>
      <div class="cn">${(w.cn||[]).join('；')}</div>
      <div class="plays">
        <span class="play uk" onclick="event.stopPropagation();playWord('${w.word}','uk')">🇬🇧 英音</span>
        <span class="play us" onclick="event.stopPropagation();playWord('${w.word}','us')">🇺🇸 美音</span>
      </div>
    </div>`).join('');
}

/* ======== quiz ======== */
function switchTab(t){
  ['tabFam','tabLearn','tabQuiz'].forEach(id => document.getElementById(id).classList.toggle('active', id==='tab'+t[0].toUpperCase()+t.slice(1)));
  document.getElementById('fam').style.display = t==='fam' ? '' : 'none';
  document.getElementById('learn').style.display = t==='learn' ? '' : 'none';
  document.getElementById('controls').style.display = t==='learn' ? '' : 'none';
  document.getElementById('quiz').style.display = t==='quiz' ? '' : 'none';
  document.getElementById('result').style.display = 'none';
  if(t==='quiz' && !quiz) startQuiz('all');
}
let quiz = null;
function renderQuizModes(){
  document.getElementById('quizModes').innerHTML = MODES.map((m,i) =>
    `<button class="famchip ${quiz && quiz.mode===i ? 'active' : ''}" onclick="setQuizMode(${i})">${m.label}</button>`).join('');
}
function setQuizMode(i){
  quiz.mode = i;
  renderQuizModes();
  startQuiz('all');
}
const MODES = [
  {id:'dictation', label:'📝 单词默写', build: q => {
    q.prompt=`<span class="bigword">${q.cur.cn[0]||q.cur.word}</span>` +
      `<div class="phon2" style="font-size:16px;margin-top:8px">` +
        (q.cur.uk?`<span class="uk">英 /${q.cur.uk}/</span>`:'') +
        (q.cur.uk&&q.cur.us?'　':'') +
        (q.cur.us?`<span class="us">美 /${q.cur.us}/</span>`:'') +
      `</div>` +
      (q.cur.cn.length>1 ? `<div style="font-size:13px;color:var(--sub);font-weight:400;margin-top:6px;line-height:1.5">${q.cur.cn.slice(1).join('；')}</div>` : '');
    q.spell=true; q.speak=true; q.img=imgOf(q.cur);
  }},
  {id:'en2cn', label:'英文 → 中文', build: q => { q.prompt=`<span class="bigword">${q.cur.word}</span>`; q.opts = pickOpts(q, 3, w=>w.cn.join('；')); q.answer=q.cur.cn.join('；'); q.speak=true; q.img=imgOf(q.cur); }},
  {id:'cn2en', label:'中文 → 英文', build: q => { q.prompt=q.cur.cn.join('；'); q.opts = pickOpts(q, 3, w=>w.word); q.answer=q.cur.word; q.speak=false; q.img=''; }},
  {id:'listen', label:'听音选词', build: q => { q.prompt=`<span class="bigword">?</span>`; q.opts = pickOpts(q, 3, w=>w.word); q.answer=q.cur.word; q.speak=true; q.img=imgOf(q.cur); }},
  {id:'spell_listen', label:'✍️ 听音拼写', build: q => { q.prompt=`<span class="bigword">🔊 听发音,拼出单词</span>`; q.spell=true; q.speak=true; q.img=imgOf(q.cur); }},
  {id:'spell_cn', label:'✍️ 中文拼写', build: q => { q.prompt=`<span class="bigword">${q.cur.cn[0]}</span>`; q.spell=true; q.speak=false; q.img=imgOf(q.cur); }},
];
function imgOf(w){ return (w && w.img) ? w.img : ''; }
function pickOpts(q, nWrong, labelFn){
  const wrongs = WORDS.filter(w => w.word !== q.cur.word).sort(()=>Math.random()-.5).slice(0,nWrong);
  const all = wrongs.concat([q.cur]).sort(()=>Math.random()-.5);
  return all.map(w => ({label: labelFn(w), correct: w.word===q.cur.word}));
}
function startQuiz(scope){
  const prevMode = quiz ? quiz.mode : 0;
  let pool;
  if(scope === 'mistakes' && quiz && quiz.wrong.length) pool = quiz.wrong.map(w=>w.word);
  else {
    const searching = document.getElementById('search').value.trim() !== '' || curGroup !== 'all';
    if(MODES[prevMode].spell && !searching){
      // spelling modes default to the 102 phonics family words (right difficulty)
      pool = [...new Set(FAMILIES.flatMap(f => f.words.map(w => w.word)))];
    } else {
      pool = visibleWords().map(w=>w.word);
    }
  }
  if(pool.length < 4){ toast('单词太少,至少需要 4 个词'); return; }
  quiz = { words: pool.slice().sort(()=>Math.random()-.5), idx: 0, score: 0, wrong: [], mode: prevMode, states: {} };
  renderQuizModes();
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = '';
  nextQuestion();
}
function nextQuestion(){
  if(quiz.idx >= quiz.words.length){ showResult(); return; }
  const w = WORDS_BY_ID[quiz.words[quiz.idx]];
  const q = {cur: w};
  MODES[quiz.mode].build(q);
  quiz.cur = q;
  const st = quiz.states[quiz.idx] || (quiz.states[quiz.idx] = {answered:false, showed:false, ok:false});
  document.getElementById('qTypeLabel').textContent = `第 ${quiz.idx+1}/${quiz.words.length} 题 · ${MODES[quiz.mode].label}`;
  document.getElementById('qPrompt').innerHTML = q.prompt;
  const qimg = document.getElementById('qImg');
  if(q.img){ qimg.src = q.img; qimg.style.display = 'block'; } else qimg.style.display = 'none';
  const showBtn = document.getElementById('showAnsBtn');
  if(st.answered) showBtn.disabled = true; else showBtn.disabled = false;
  const ansCard = document.getElementById('ansCard');
  if(st.answered){
    ansCard.style.display = 'block';
    ansCard.innerHTML = (st.ok
      ? `<div class="alabel">✅ 回答正确</div><div class="aword">${q.cur.word}</div><div class="acn">${q.cur.cn[0]}</div>`
      : `<div class="alabel">❌ 正确答案</div><div class="aword">${q.cur.word}</div><div class="acn">${q.cur.cn[0]}</div>`);
  } else {
    ansCard.style.display = 'none';
    ansCard.innerHTML = '';
  }
  const spellArea = document.getElementById('spellArea');
  if(q.spell){
    document.getElementById('options').style.display = 'none';
    spellArea.style.display = '';
    const inp = document.getElementById('spellInput');
    const chkBtn = document.querySelector('.spellcheckbtn');
    const fb = document.getElementById('spellFb');
    if(st.answered){
      // 回看已答题:显示结果,禁用作答
      inp.value = st.user || '';
      inp.disabled = true; chkBtn.disabled = true;
      inp.className = 'spellinput ' + (st.ok ? 'right' : 'wrong');
      fb.className = 'spellfb ' + (st.ok ? 'right' : 'wrong');
      fb.innerHTML = st.showed ? `👀 已看答案 · 正确答案是 <span class="ans">${q.cur.word}</span> · ${q.cur.cn[0]}`
        : (st.ok ? `✅ 正确!${q.cur.word} ${q.cur.cn[0]}` : `❌ 你写的是「${st.user||'空'}」,正确答案是 <span class="ans">${q.cur.word}</span> · ${q.cur.cn[0]}`);
    } else {
      inp.value = ''; inp.disabled = false; chkBtn.disabled = false;
      inp.className = 'spellinput'; fb.innerHTML = ''; fb.className = 'spellfb';
    }
    document.getElementById('qIdx').textContent = `第 ${quiz.idx+1} / ${quiz.words.length} 题`;
    document.getElementById('qScore').textContent = `✅ ${quiz.score}`;
    quiz.answered = st.answered;
    if(!st.answered){
      if(q.speak) setTimeout(() => { speakCurrent('us'); setTimeout(()=>{ try{inp.focus();}catch(e){} }, 400); }, 400);
      else setTimeout(()=>{ try{inp.focus();}catch(e){} }, 300);
    }
    return;
  }
  document.getElementById('options').style.display = '';
  spellArea.style.display = 'none';
  document.getElementById('options').innerHTML = q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})">${o.label}</button>`).join('');
  if(st.answered){
    // 回看已答题:高亮当时的选择
    const correctIdx = q.opts.findIndex(o=>o.correct);
    document.getElementById(`opt${correctIdx}`).classList.add('right');
    if(!st.ok && st.userIdx !== undefined) document.getElementById(`opt${st.userIdx}`).classList.add('wrong');
  }
  document.getElementById('qIdx').textContent = `第 ${quiz.idx+1} / ${quiz.words.length} 题`;
  document.getElementById('qScore').textContent = `✅ ${quiz.score}`;
  quiz.answered = st.answered;
  if(q.speak && !st.answered) setTimeout(speakCurrent, 400);
}
function speakCurrent(variant){
  const q = quiz.cur; if(!q) return;
  playWord(q.cur.word, variant || 'us');
}
function checkSpell(){
  if(quiz.answered) return;
  quiz.answered = true;
  const q = quiz.cur;
  const inp = document.getElementById('spellInput');
  const user = inp.value.trim().toLowerCase();
  const ok = user === q.cur.word;
  const st = quiz.states[quiz.idx];
  st.answered = true; st.ok = ok; st.user = user; st.showed = false;
  const fb = document.getElementById('spellFb');
  inp.className = 'spellinput ' + (ok ? 'right' : 'wrong');
  document.querySelector('.spellcheckbtn').disabled = true;
  document.getElementById('showAnsBtn').disabled = true;
  const ansCard = document.getElementById('ansCard');
  ansCard.style.display = 'block';
  if(ok){
    fb.className = 'spellfb right';
    fb.innerHTML = `✅ 正确!${q.cur.word} ${q.cur.cn[0]}`;
    ansCard.innerHTML = `<div class="alabel">✅ 回答正确</div><div class="aword">${q.cur.word}</div><div class="acn">${q.cur.cn[0]}</div>`;
    quiz.score++;
  } else {
    fb.className = 'spellfb wrong';
    fb.innerHTML = `❌ 你写的是「${user||'空'}」,正确答案是 <span class="ans">${q.cur.word}</span> · ${q.cur.cn[0]}`;
    ansCard.innerHTML = `<div class="alabel">❌ 正确答案</div><div class="aword">${q.cur.word}</div><div class="acn">${q.cur.cn[0]}</div>`;
    quiz.wrong.push(q.cur);
  }
  document.getElementById('qScore').textContent = `✅ ${quiz.score}`;
}
function answer(i){
  if(quiz.answered) return;
  quiz.answered = true;
  const q = quiz.cur;
  const ok = q.opts[i].correct;
  const st = quiz.states[quiz.idx];
  st.answered = true; st.ok = ok; st.userIdx = i; st.showed = false;
  document.getElementById(`opt${i}`).classList.add(ok?'right':'wrong');
  q.opts.forEach((o, j) => { if(o.correct && j!==i) document.getElementById(`opt${j}`).classList.add('right'); });
  document.getElementById('showAnsBtn').disabled = true;
  if(ok) quiz.score++; else quiz.wrong.push(q.cur);
  document.getElementById('qScore').textContent = `✅ ${quiz.score}`;
}
function navQ(d){
  if(!quiz) return;
  const ni = quiz.idx + d;
  if(ni < 0){ toast('已经是第一题'); return; }
  if(ni >= quiz.words.length){
    if(d > 0 && quiz.states[quiz.idx] && quiz.states[quiz.idx].answered){
      quiz.idx = quiz.words.length;
      nextQuestion();  // 触发结果页
    } else {
      toast('最后一题啦,先确认答案再看结果');
    }
    return;
  }
  quiz.idx = ni;
  nextQuestion();
}
function showAnswer(){
  if(!quiz) return;
  const q = quiz.cur;
  const st = quiz.states[quiz.idx];
  if(st.answered) return;  // 已提交的题不能再偷看
  st.showed = true;
  document.getElementById('showAnsBtn').disabled = true;
  const ansCard = document.getElementById('ansCard');
  ansCard.style.display = 'block';
  ansCard.innerHTML = `<div class="alabel">👀 答案</div><div class="aword">${q.cur.word}</div><div class="acn">${q.cur.cn[0]}</div>`;
  const navBtns = document.querySelectorAll('.qnavbtn');
  navBtns.forEach(b => b.disabled = true);
  let inp = null, chkBtn = null, fb = null;
  if(q.spell){
    inp = document.getElementById('spellInput');
    inp.value = q.cur.word;
    inp.disabled = true;
    chkBtn = document.querySelector('.spellcheckbtn'); chkBtn.disabled = true;
    fb = document.getElementById('spellFb');
    fb.className = 'spellfb wrong';
    fb.innerHTML = `👀 答案 ${q.cur.word} · 6 秒后消失,记好哦`;
  } else {
    q.opts.forEach((o, j) => { if(o.correct) document.getElementById(`opt${j}`).classList.add('right'); });
  }
  // 6 秒后自动消失,恢复默写
  setTimeout(() => {
    if(st.answered) return;  // 期间已提交,不重置界面
    ansCard.style.display = 'none'; ansCard.innerHTML = '';
    document.getElementById('showAnsBtn').disabled = false;
    navBtns.forEach(b => { b.disabled = false; });
    if(q.spell){
      inp.disabled = false; chkBtn.disabled = false;
      inp.value = ''; inp.className = 'spellinput';
      fb.innerHTML = ''; fb.className = 'spellfb';
      setTimeout(()=>{ try{inp.focus();}catch(e){} }, 120);
    } else {
      document.getElementById('options').innerHTML = q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})">${o.label}</button>`).join('');
    }
    toast('⏱️ 看完了,自己默写吧');
  }, 6000);
}
function showResult(){
  document.getElementById('quiz').style.display = 'none';
  const r = document.getElementById('result');
  r.style.display = '';
  document.getElementById('scoreNum').textContent = `${quiz.score} / ${quiz.words.length}`;
  const nShow = Object.values(quiz.states).filter(s => s.showed).length;
  document.getElementById('scoreDetail').textContent = `正确率 ${Math.round(100*quiz.score/quiz.words.length)}%` + (nShow ? ` · 👀 看过答案 ${nShow} 题` : '');
  const ml = document.getElementById('mistakeList');
  ml.innerHTML = quiz.wrong.length ? '<div style="font-weight:700;margin:8px 0">📌 错题本(点一下听发音)</div>' + quiz.wrong.map(w=>`
    <div class="mistake-item" onclick="playWord('${w.word}','us')">
      <span class="w">${w.word}</span>
      <span class="c">${(WORDS_BY_ID[w.word].cn||[]).join('；')}</span>
    </div>`).join('') : '<p style="color:var(--good);font-weight:700">🏆 全部答对,太棒了!</p>';
}
function restartQuiz(){ startQuiz('all'); }
function retryMistakes(){ startQuiz('mistakes'); }

/* ======== misc ======== */
function toast(t){ const e = document.getElementById('toast'); e.textContent=t; e.classList.add('show'); setTimeout(()=>e.classList.remove('show'), 1800); }
document.getElementById('groupSel').addEventListener('change', e => curGroup = e.target.value);

initGroups();
renderFamNav();
renderFam();
renderLearn();
</script>
